name: Sync Obsidian notes

on:
  schedule:
    # 每 3 天 01:00 UTC（約台北時間 09:00）
    - cron: '0 1 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Sync Vue / C# notes
        env:
          # PAT：至少要有 private repo jack755051/obsidian_notes 的 read
          GH_TOKEN: ${{ secrets.OBSIDIAN_NOTES_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing secret OBSIDIAN_NOTES_TOKEN" >&2
            exit 1
          fi
          chmod +x scripts/sync-obsidian-notes.sh
          ./scripts/sync-obsidian-notes.sh

      - name: Commit if changed
        env:
          # 用預設 GITHUB_TOKEN 寫回本 repo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/notes/sync
          if git diff --staged --quiet; then
            echo "No note changes."
          else
            git commit -m "[chore]: 同步 Obsidian Vue／C# 筆記"
            git push
          fi
